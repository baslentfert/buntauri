[package]
name = "buntauri_window"
version = "0.1.0"
edition = "2021"
description = "Native window layer for buntauri: tao + wry on a dedicated UI thread, driven by a host (Bun) thread"
license = "MIT"

[dependencies]
# No "dbus" default feature: on Linux it would make bun link libdbus (tao uses it only to follow the system theme).
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
muda = { version = "0.21", default-features = false }
tray-icon = { version = "0.26", default-features = false }
png = "0.18"
base64 = "0.23"
raw-window-handle = "0.6"
open = "5"
# Native extras, the same crates Tauri's dialog, clipboard, global-shortcut and notification plugins use.
rfd = { version = "0.17", default-features = false }
arboard = { version = "3.6", default-features = false }
global-hotkey = "0.8"
notify-rust = { version = "4.18", default-features = false }


# macOS: read the window's content size straight from AppKit (see control.rs).
# Already in the tree through tao/wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

# Linux/BSD: menus need GTK 3, the tray needs libappindicator (both tray-icon/muda defaults there).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
muda = { version = "0.21", default-features = false, features = ["gtk3"] }
tray-icon = { version = "0.26", default-features = false, features = ["libappindicator"] }
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
notify-rust = { version = "4.18", default-features = false, features = ["z"] }

# Own lint policy; do not inherit the lints of a workspace this crate is built in (e.g. Bun).
[lints]
