[package]
name = "buntauri_window"
version = "0.1.0"
edition = "2021"
description = "Native window layer for buntauri: tao + wry on a dedicated UI thread, driven by a host (Bun) thread"
license = "MIT"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
muda = { version = "0.21", default-features = false }
tray-icon = { version = "0.26", default-features = false }
png = "0.18"
base64 = "0.23"


# Linux/BSD: menus need GTK 3, the tray needs libappindicator (both tray-icon/muda defaults there).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
muda = { version = "0.21", default-features = false, features = ["gtk3"] }
tray-icon = { version = "0.26", default-features = false, features = ["libappindicator"] }

# Own lint policy; do not inherit the lints of a workspace this crate is built in (e.g. Bun).
[lints]
