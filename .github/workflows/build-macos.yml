# Build Bun with buntauri on macOS (Apple Silicon).
# Manual for now: Actions > "Build macOS" > Run workflow.
name: Build macOS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Bun build profile"
        type: choice
        # release: Bun's Unix debug builds use -Werror for unused code, which
        # trips over upstream Bun itself at times; release does not.
        options: [release, debug]
        default: release

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - name: Disk space before
        run: df -h /

      - name: Free disk space
        # Bun needs a lot of room; drop big preinstalled SDKs we don't use.
        run: |
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet /usr/local/lib/node_modules \
            /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          xcrun simctl delete all || true
          df -h /

      - uses: actions/checkout@v4
        with:
          path: buntauri

      - name: Check out Bun at UPSTREAM
        run: |
          sha=$(head -n1 buntauri/UPSTREAM)
          mkdir bun && cd bun
          git init -q && git remote add origin https://github.com/oven-sh/bun.git
          git fetch --depth 1 origin "$sha" && git checkout -q FETCH_HEAD
          git log -1 --oneline

      - uses: oven-sh/setup-bun@v2

      - name: Tooling
        run: |
          brew install automake ccache cmake coreutils gnu-sed go icu4c libiconv libtool ninja pkg-config ruby llvm@23 nasm
          echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"
          rustup --version

      - name: Window crate tests
        working-directory: buntauri
        run: cargo test

      - name: Apply buntauri to Bun
        run: bun buntauri/scripts/sync.ts bun

      - name: Build Bun (${{ inputs.profile }})
        working-directory: bun
        # Run Bun's build like locally: its CI mode (on when CI/GITHUB_ACTIONS
        # are set) is for Bun's Buildkite: it buffers output for annotations
        # and fetches a symbol order file. GitHub ignores `env:` overrides of
        # GITHUB_* variables, so they are removed with `env -u` below.
        # Full output goes to a file: the link prints thousands of harmless
        # lld warnings that push the real errors out of the Actions log.
        run: |
          set -o pipefail
          env -u CI -u GITHUB_ACTIONS bun run build:${{ inputs.profile }} 2>&1 | tee ../build.log | grep -v "Linking two modules of different target triples"

      - name: Build errors
        if: failure()
        run: |
          grep -v "Linking two modules of different target triples" build.log             | grep -iE "error|undefined|not found|cannot|unable|FAILED|not expected|violation"             | grep -vE "type error|ts-expect|TS[0-9]{4}" | head -150 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.job }}-${{ runner.os }}
          path: build.log
          retention-days: 7

      - name: Disk space after
        if: always()
        run: df -h /

      - name: Smoke test
        working-directory: bun
        run: |
          exe=build/${{ inputs.profile }}/bun${{ inputs.profile == 'debug' && '-debug' || '' }}
          "$exe" --revision
          "$exe" -e 'const m = await import("bun:buntauri"); console.log("bun:buntauri exports:", Object.keys(m.default ?? m))'

      - name: Upload Bun
        uses: actions/upload-artifact@v4
        with:
          name: bun-buntauri-darwin-arm64-${{ inputs.profile }}
          path: bun/build/${{ inputs.profile }}/bun*
          if-no-files-found: warn
          retention-days: 7
