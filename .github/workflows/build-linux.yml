# Build Bun with buntauri on Linux (Ubuntu, x64).
# Manual for now: Actions > "Build Linux" > Run workflow.
name: Build Linux

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Bun build profile"
        type: choice
        # release: Bun's Unix debug builds use -Werror for unused code, which
        # trips over upstream Bun itself at times; release does not.
        options: [release, debug]
        default: release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        # Bun needs a lot of room; drop big preinstalled toolchains we don't use.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Add swap
        # Bun's release link (ThinLTO over all of Bun) needs more than the
        # runner's 16 GB; without swap the linker dies without a message.
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h

      - uses: actions/checkout@v4
        with:
          path: buntauri

      - name: Check out Bun at UPSTREAM
        run: |
          sha=$(head -n1 buntauri/UPSTREAM)
          mkdir bun && cd bun
          git init -q && git remote add origin https://github.com/oven-sh/bun.git
          git fetch --depth 1 origin "$sha" && git checkout -q FETCH_HEAD
          git log -1 --oneline

      - uses: oven-sh/setup-bun@v2

      - name: Tooling
        run: |
          sudo apt-get update
          # Bun's documented build dependencies.
          sudo apt-get install -y curl wget lsb-release software-properties-common cmake git golang libtool \
            ninja-build pkg-config ruby-full xz-utils ccache nasm
          # tao/wry/tray-icon: GTK 3, WebKitGTK 4.1, appindicator for the tray.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          wget -q https://apt.llvm.org/llvm.sh -O - | sudo bash -s -- 23 all
          which clang-23

      - name: Window crate tests
        working-directory: buntauri
        run: cargo test

      - name: Apply buntauri to Bun
        run: bun buntauri/scripts/sync.ts bun

      - name: Build Bun (${{ inputs.profile }})
        working-directory: bun
        # Full output goes to a file: the link prints thousands of harmless
        # lld warnings that push the real errors out of the Actions log.
        run: |
          set -o pipefail
          bun run build:${{ inputs.profile }} 2>&1 | tee ../build.log | grep -v "Linking two modules of different target triples"

      - name: Build errors
        if: failure()
        run: |
          echo "--- memory / OOM killer"
          free -h
          sudo dmesg 2>/dev/null | grep -iE "out of memory|killed process|oom" | tail -5 || true
          echo "--- errors from build.log"
          grep -v "Linking two modules of different target triples" build.log             | grep -iE "error|undefined|not found|cannot|unable|FAILED|not expected|violation"             | grep -vE "type error|ts-expect|TS[0-9]{4}" | head -150 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.job }}-${{ runner.os }}
          path: build.log
          retention-days: 7

      - name: Disk space after
        if: always()
        run: df -h /

      - name: Smoke test
        working-directory: bun
        run: |
          exe=build/${{ inputs.profile }}/bun${{ inputs.profile == 'debug' && '-debug' || '' }}
          "$exe" --revision
          "$exe" -e 'const m = await import("bun:buntauri"); console.log("bun:buntauri exports:", Object.keys(m.default ?? m))'

      - name: Upload Bun
        uses: actions/upload-artifact@v4
        with:
          name: bun-buntauri-linux-x64-${{ inputs.profile }}
          path: bun/build/${{ inputs.profile }}/bun*
          if-no-files-found: warn
          retention-days: 7
